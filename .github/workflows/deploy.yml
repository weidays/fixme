name: Build & deploy

# Builds the static site + Functions and deploys to Cloudflare Pages.
# Fires when content or code lands on main (i.e. when you merge a review PR),
# and can be run manually.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'functions/**'
      - 'astro.config.mjs'
      - 'wrangler.toml'
      - 'content-backlog.json'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # IndexNow step diffs against the previous commit

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install

      - name: Analytics beacon check
        env:
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN || secrets.CF_BEACON_TOKEN }}
        run: |
          if [ -z "$CF_BEACON_TOKEN" ]; then
            echo "::warning::CF_BEACON_TOKEN is not set (neither repo Variable nor Secret) — Cloudflare Web Analytics will not collect visits."
          else
            echo "CF_BEACON_TOKEN found (${#CF_BEACON_TOKEN} chars) — beacon will be injected."
          fi

      - run: npm run build
        env:
          # Cloudflare Web Analytics beacon token. Read from either the repo
          # Variables tab or the Secrets tab, whichever it was saved under.
          # Unset in both = build without the beacon.
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN || secrets.CF_BEACON_TOKEN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fixme-vip

      # Ping Bing & other IndexNow engines with the pages this deploy changed.
      # Pushes diff against the previous main; manual / pipeline-dispatched runs
      # diff against the parent commit (the pipeline's publish commit).
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            base=$(git rev-parse HEAD~1)
          fi
          npx tsx scripts/indexnow.ts "$base" HEAD
